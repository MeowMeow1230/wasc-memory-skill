[project]
name = "wasc-memory-skill"
version = "0.1.0"
description = "WASC 5月挑戰賽 — 自成長記憶 AI Skill (程式開發助手)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
wasc-memory = "src.memory_server:main"
wasc-test = "tests.test_harness:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
